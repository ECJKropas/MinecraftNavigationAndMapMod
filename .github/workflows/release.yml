name: Auto Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ ! contains(github.event.head_commit.message, 'no release') && ! contains(github.event.head_commit.message, 'NO RELEASE') && ! contains(github.event.head_commit.message, 'No Release') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Determine new version
        id: version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          CURRENT_VERSION=$(grep 'modVersion' gradle.properties | sed 's/modVersion *= *//')
          echo "Current version: $CURRENT_VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if echo "$COMMIT_MSG" | grep -qE '^feat(\(.*\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            SKIP=false
            echo "Bumping minor: feat detected"
          elif echo "$COMMIT_MSG" | grep -qE '^fix(\(.*\))?:'; then
            PATCH=$((PATCH + 1))
            SKIP=false
            echo "Bumping patch: fix detected"
          else
            SKIP=true
            echo "No feat/fix prefix found, skipping release"
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "skip=${SKIP}" >> $GITHUB_OUTPUT
          echo "current_version=${CURRENT_VERSION}" >> $GITHUB_OUTPUT

      - name: Bump version in gradle.properties
        if: steps.version.outputs.skip != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          sed -i "s/^modVersion[[:space:]]*=[[:space:]]*.*/modVersion = ${NEW_VERSION}/" gradle.properties
          echo "Updated gradle.properties:"
          grep 'modVersion' gradle.properties

      - name: Commit and push version bump
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore(release): bump version to v${{ steps.version.outputs.new_version }}"
          git push

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          BUILD_RELEASE: "true"
        run: ./gradlew build -x spotlessCheck

      - name: Generate release notes
        if: steps.version.outputs.skip != 'true'
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Get tag of previous version, fallback to first commit
          PREV_TAG=$(git tag --sort=-creatordate | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          # Use the original triggering commit (HEAD~1 after version bump push) as range end
          # to exclude the 'chore(release):' bump commit from release notes
          NOTES=$(git log "${PREV_TAG}..HEAD~1" --pretty=format:'- %s (%an)')
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          gh release create "v${VERSION}" \
            "versions/1.20.1/build/libs/wayfarer-v${VERSION}-mc1.20.1.jar" \
            "versions/26.2/build/libs/wayfarer-v${VERSION}-mc26.2.jar" \
            "versions/26.1.1/build/libs/wayfarer-v${VERSION}-mc26.1.1.jar" \
            --title "v${VERSION}" \
            --notes "${{ steps.notes.outputs.notes }}"
