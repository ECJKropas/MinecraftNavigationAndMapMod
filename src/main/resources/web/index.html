<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayfarer — 道路编辑器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root {
  --blue: #007AFF;
  --blue-hover: #0062CC;
  --blue-pressed: #004999;
  --red: #FF3B30;
  --red-hover: #D63028;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --surface: #ffffff;
  --bg: #f5f5f7;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius-sm: 7px;
  --radius-lg: 15px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body { font-family:var(--font); background:var(--bg); color:var(--text-primary); line-height:1.47059; overflow:hidden; }

#map {
  position:fixed; top:0; right:0; bottom:0; left:44px;
  background:#e8e8ed; z-index:0;
  transition:left 260ms cubic-bezier(0.22,1,0.36,1);
}

/* Toolbar — left sidebar */
#toolbar {
  position:fixed; top:0; left:0; bottom:0; z-index:10;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-right:1px solid rgba(0,0,0,0.06);
  box-shadow:2px 0 20px rgba(0,0,0,0.06);
  padding:10px 6px;
  display:flex; flex-direction:column; gap:2px;
  transition:width 260ms cubic-bezier(0.22,1,0.36,1);
  overflow:hidden;
}
#toolbar.toolbar-compact { width:44px; }
#toolbar.toolbar-detailed { width:148px; }

.tool-btn {
  width:100%; height:34px;
  display:flex; align-items:center; gap:0;
  border:none; background:none; border-radius:9px;
  cursor:pointer; padding:0;
  font-family:var(--font); font-size:12px; font-weight:500;
  color:var(--text-secondary);
  transition:background 120ms ease, color 120ms ease, transform 180ms cubic-bezier(0.22,1,0.36,1);
  outline:none;
  white-space:nowrap;
}
.tool-btn i {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0;
  transition:transform 180ms cubic-bezier(0.22,1,0.36,1);
}
.tool-btn:hover { background:rgba(0,0,0,0.06); transform:scale(1.06); }
.tool-btn:active { transform:scale(0.97); }

.tool-btn.selected {
  background:var(--blue);
  color:#fff;
}
.tool-btn.selected:hover { background:var(--blue-hover); }
.tool-btn.selected:active { background:var(--blue-pressed); }

.tool-label {
  padding-left:2px; overflow:hidden;
  transition:opacity 160ms ease, width 160ms ease;
  text-align:left;
}
.toolbar-compact .tool-label { opacity:0; width:0; }
.toolbar-detailed .tool-label { opacity:1; width:auto; }

.toolbar-divider {
  width:100%; height:1px; background:rgba(0,0,0,0.08); margin:4px 0;
}

#mode-toggle-icon {
  transition:transform 280ms cubic-bezier(0.22,1,0.36,1);
}
.toolbar-detailed #mode-toggle-icon { transform:rotate(180deg); }

/* Floating editor — top-right */
#editor-panel {
  position:fixed; top:16px; right:16px; z-index:20;
  min-width:280px; max-width:340px;
  background:rgba(255,255,255,0.78);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:var(--radius-lg);
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:var(--shadow-lg);
  padding:16px 18px 18px;
  opacity:0; transform:translateY(-8px) scale(0.97);
  transition:opacity 220ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;
}
#editor-panel.visible {
  opacity:1; transform:translateY(0) scale(1);
  pointer-events:auto;
}

.section-label {
  font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--text-tertiary); margin-bottom:8px;
}
.field {
  display:flex; align-items:center; gap:10px; min-height:30px; margin-bottom:8px;
}
.field:last-of-type { margin-bottom:0; }
.field-label {
  font-size:12px; font-weight:500; color:var(--text-secondary);
  min-width:38px; flex-shrink:0;
}
.field-value {
  font-size:12px; color:var(--text-primary); font-weight:400;
  word-break:break-all; flex:1;
}
.field-value.mono {
  font-family:"SF Mono","Menlo","Monaco",monospace;
  font-size:11px; color:var(--text-tertiary);
}

input, select {
  font-family:var(--font); font-size:12px; font-weight:400;
  background:rgba(255,255,255,0.7); color:var(--text-primary);
  border:1px solid rgba(0,0,0,0.12); border-radius:var(--radius-sm);
  padding:4px 9px; outline:none; transition:border-color 120ms ease, box-shadow 120ms ease;
  width:110px;
}
input:focus, select:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,122,255,0.16);
}
input[type="color"] {
  width:26px; height:26px; padding:2px; border-radius:var(--radius-sm); cursor:pointer;
}
input[type="number"] { -moz-appearance:textfield; }
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }

.btn-row { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }

button {
  font-family:var(--font); font-size:11px; font-weight:590; letter-spacing:-0.01em;
  border:none; border-radius:var(--radius-sm); padding:5px 12px;
  cursor:pointer; transition:background 120ms ease, transform 80ms ease;
  display:inline-flex; align-items:center; gap:4px;
  -webkit-user-select:none; user-select:none;
}
button:active { transform:scale(0.97); }
button.primary { background:var(--blue); color:#fff; }
button.primary:hover { background:var(--blue-hover); }
button.primary:active { background:var(--blue-pressed); }
button.secondary {
  background:rgba(0,0,0,0.04); color:var(--text-primary);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);
}
button.secondary:hover { background:rgba(0,0,0,0.08); }
button.secondary:active { background:rgba(0,0,0,0.12); }
button.danger { background:var(--red); color:#fff; }
button.danger:hover { background:var(--red-hover); }
button.danger:active { background:#B3201A; }

.empty-state {
  font-size:12px; color:var(--text-tertiary); font-weight:400;
  display:flex; align-items:center; gap:6px;
}
.empty-state::before {
  content:''; display:block; width:5px; height:5px;
  border-radius:50%; background:var(--text-tertiary); opacity:0.5;
}

/* Tool toast — bottom-right */
#tool-toast {
  position:fixed; bottom:20px; right:20px; z-index:50;
  background:#fff; color:var(--red);
  font-size:12px; font-weight:500; font-family:var(--font);
  padding:8px 16px; border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);
  pointer-events:none;
  opacity:0; transform:translateX(12px);
  transition:opacity 200ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
}
#tool-toast.visible {
  opacity:1; transform:translateX(0);
}

.leaflet-control-zoom a {
  color:var(--text-primary) !important;
  box-shadow:var(--shadow-sm) !important;
  border-radius:var(--radius-sm) !important;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration:0ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  #toolbar, #editor-panel { background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none; }
}
</style>
</head>
<body>
<div id="map"></div>

<div id="toolbar" class="toolbar-compact">
  <button class="tool-btn" id="tool-move" title="移动节点">
    <i class="fa-solid fa-arrows-up-down-left-right"></i>
    <span class="tool-label">移动</span>
  </button>
  <button class="tool-btn" id="tool-point" title="描点">
    <i class="fa-solid fa-circle-plus"></i>
    <span class="tool-label">描点</span>
  </button>
  <button class="tool-btn" id="tool-merge" title="合并节点">
    <i class="fa-solid fa-object-group"></i>
    <span class="tool-label">合并</span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="tool-btn" id="tool-undo" title="撤销 (Ctrl+Z)">
    <i class="fa-solid fa-arrow-rotate-left"></i>
    <span class="tool-label">撤销</span>
  </button>
  <button class="tool-btn" id="tool-redo" title="重做 (Ctrl+Shift+Z)">
    <i class="fa-solid fa-arrow-rotate-right"></i>
    <span class="tool-label">重做</span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="tool-btn" id="tool-mode-toggle" title="展开工具栏">
    <i class="fa-solid fa-chevron-right" id="mode-toggle-icon"></i>
    <span class="tool-label">展开</span>
  </button>
</div>

<div id="tool-toast"></div>

<div id="editor-panel">
  <div id="no-selection" class="empty-state">点击节点或路段查看属性</div>

  <div id="node-editor" style="display:none">
    <div class="section-label">节点属性</div>
    <div class="field"><span class="field-label">ID</span><span class="field-value mono" id="node-id"></span></div>
    <div class="field"><span class="field-label">X</span><input type="number" id="node-x" step="0.1"></div>
    <div class="field"><span class="field-label">Z</span><input type="number" id="node-z" step="0.1"></div>
    <div class="field"><span class="field-label">来源</span><span class="field-value" id="node-source"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveNode()">保存</button>
      <button class="secondary" onclick="clearSelection()">取消</button>
      <button class="danger" id="node-split-btn" style="display:none" onclick="splitSegment()">在此拆分</button>
      <button class="danger" onclick="deleteNode()">删除节点</button>
    </div>
  </div>

  <div id="segment-editor" style="display:none">
    <div class="section-label">路段属性</div>
    <div class="field"><span class="field-label">ID</span><span class="field-value mono" id="seg-id"></span></div>
    <div class="field"><span class="field-label">等级</span>
      <select id="seg-classification">
        <option value="">—</option>
        <option value="G">国道/高速</option>
        <option value="S">省道/高架</option>
        <option value="X">县道</option>
        <option value="Y">乡道</option>
        <option value="C">村道</option>
      </select>
    </div>
    <div class="field"><span class="field-label">编号</span><input type="text" id="seg-number" placeholder="如 107"></div>
    <div class="field"><span class="field-label">道路名</span><input type="text" id="seg-road-name" placeholder="未命名道路"></div>
    <div class="field"><span class="field-label">来源</span><span class="field-value" id="seg-source"></span></div>
    <div class="field"><span class="field-label">状态</span><span class="field-value" id="seg-status"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveRoad()">保存道路</button>
      <button class="secondary" onclick="clearSelection()">取消</button>
      <button class="primary" id="merge-btn" style="display:none" onclick="mergeSegments()">合并选中</button>
      <button class="danger" onclick="deleteSegment()">删除路段</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
