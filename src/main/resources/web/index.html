<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayfarer — 道路编辑器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
:root {
  --blue: #007AFF;
  --blue-hover: #0062CC;
  --blue-pressed: #004999;
  --red: #FF3B30;
  --red-hover: #D63028;
  --text-primary: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #aeaeb2;
  --surface: #ffffff;
  --bg: #f5f5f7;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius-sm: 7px;
  --radius-lg: 15px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.55);
  --glass-blur: blur(30px) saturate(190%);
  --glass-shadow: 0 10px 40px rgba(0,0,0,0.12);
  --glass-inset: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 0 0 1px rgba(255,255,255,0.18);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
body { font-family:var(--font); background:var(--bg); color:var(--text-primary); line-height:1.47059; overflow:hidden; }

/* Ambient colour wash — gives the frosted glass something to refract (Apple vibrancy) */
body::before {
  content:'';
  position:fixed; inset:-12%; z-index:-1;
  background:
    radial-gradient(40% 35% at 12% 18%, rgba(0,122,255,0.22), transparent 70%),
    radial-gradient(38% 32% at 88% 12%, rgba(175,82,222,0.18), transparent 70%),
    radial-gradient(45% 40% at 82% 88%, rgba(255,149,0,0.16), transparent 70%),
    radial-gradient(42% 38% at 18% 92%, rgba(52,199,89,0.14), transparent 70%),
    linear-gradient(160deg, #f5f5f7 0%, #eef1f6 55%, #e8ecf3 100%);
  filter:blur(24px); -webkit-filter:blur(24px);
}

#map {
  position:fixed; top:0; right:0; bottom:0; left:44px;
  background:rgba(236,236,241,0.6); z-index:0;
  transition:left 260ms cubic-bezier(0.22,1,0.36,1);
}
.leaflet-container { background:transparent !important; }

.constrain-popup {
  position:absolute; left:100%;
  display:none; align-items:center; justify-content:center;
  width:28px; height:28px;
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border-radius:8px; box-shadow:var(--shadow-lg);
  border:1px solid var(--glass-border);
  z-index:100;
}
.constrain-popup.visible { display:flex; }
.constrain-btn {
  width:22px; height:22px;
  display:flex; align-items:center; justify-content:center;
  border:none; background:none; border-radius:5px;
  cursor:pointer; color:var(--text-secondary); font-size:12px;
  transition:background 120ms, color 120ms;
}
.constrain-btn:hover { background:rgba(0,0,0,0.06); }
.constrain-btn.active { background:var(--blue); color:#fff; }

/* Toolbar — left sidebar */
#toolbar {
  position:fixed; top:0; left:0; bottom:0; z-index:10;
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-right:1px solid var(--glass-border);
  box-shadow:2px 0 24px rgba(0,0,0,0.10), inset -1px 0 0 rgba(255,255,255,0.45);
  padding:10px 6px;
  display:flex; flex-direction:column; gap:2px;
  transition:width 260ms cubic-bezier(0.22,1,0.36,1);
  overflow:hidden;
}
#toolbar.toolbar-compact { width:44px; }
#toolbar.toolbar-detailed { width:148px; }

.tool-btn {
  width:100%; height:34px;
  display:flex; align-items:center; gap:0;
  border:none; background:none; border-radius:9px;
  cursor:pointer; padding:0;
  font-family:var(--font); font-size:12px; font-weight:500;
  color:var(--text-secondary);
  transition:background 120ms ease, color 120ms ease, transform 180ms cubic-bezier(0.22,1,0.36,1);
  outline:none;
  white-space:nowrap;
}
.tool-btn i {
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  font-size:14px; flex-shrink:0;
  transition:transform 180ms cubic-bezier(0.22,1,0.36,1);
}
.tool-btn:hover { background:rgba(0,0,0,0.06); transform:scale(1.06); }
.tool-btn:active { transform:scale(0.97); }

.tool-btn.selected {
  background:var(--blue);
  color:#fff;
}
.tool-btn.selected:hover { background:var(--blue-hover); }
.tool-btn.selected:active { background:var(--blue-pressed); }

.tool-label {
  padding-left:2px; overflow:hidden;
  transition:opacity 160ms ease, width 160ms ease;
  text-align:left;
}
.toolbar-compact .tool-label { opacity:0; width:0; }
.toolbar-detailed .tool-label { opacity:1; width:auto; }

.toolbar-divider {
  width:100%; height:1px; background:rgba(0,0,0,0.08); margin:4px 0;
}

#mode-toggle-icon {
  transition:transform 280ms cubic-bezier(0.22,1,0.36,1);
}
.toolbar-detailed #mode-toggle-icon { transform:rotate(180deg); }

/* Floating editor — top-right */
#editor-panel {
  position:fixed; top:16px; right:16px; z-index:20;
  min-width:280px; max-width:340px;
  background:rgba(255,255,255,0.42);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-lg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow), var(--glass-inset);
  padding:16px 18px 18px;
  opacity:0; transform:translateY(-8px) scale(0.97);
  transition:opacity 220ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;
}
#editor-panel.visible {
  opacity:1; transform:translateY(0) scale(1);
  pointer-events:auto;
}

.section-label {
  font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--text-tertiary); margin-bottom:8px;
}
.field {
  display:flex; align-items:center; gap:10px; min-height:30px; margin-bottom:8px;
}
.field:last-of-type { margin-bottom:0; }
.field-label {
  font-size:12px; font-weight:500; color:var(--text-secondary);
  min-width:38px; flex-shrink:0;
}
.field-value {
  font-size:12px; color:var(--text-primary); font-weight:400;
  word-break:break-all; flex:1;
}
.field-value.mono {
  font-family:"SF Mono","Menlo","Monaco",monospace;
  font-size:11px; color:var(--text-tertiary);
}

input, select {
  font-family:var(--font); font-size:12px; font-weight:400;
  background:rgba(255,255,255,0.7); color:var(--text-primary);
  border:1px solid rgba(0,0,0,0.12); border-radius:var(--radius-sm);
  padding:4px 9px; outline:none; transition:border-color 120ms ease, box-shadow 120ms ease;
  width:110px;
}
input:focus, select:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(0,122,255,0.16);
}
input[type="color"] {
  width:26px; height:26px; padding:2px; border-radius:var(--radius-sm); cursor:pointer;
}
input[type="number"] { -moz-appearance:textfield; }
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }

.btn-row { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }

button {
  font-family:var(--font); font-size:11px; font-weight:590; letter-spacing:-0.01em;
  border:none; border-radius:var(--radius-sm); padding:5px 12px;
  cursor:pointer; transition:background 120ms ease, transform 80ms ease;
  display:inline-flex; align-items:center; gap:4px;
  -webkit-user-select:none; user-select:none;
}
button:active { transform:scale(0.97); }
button.primary { background:var(--blue); color:#fff; }
button.primary:hover { background:var(--blue-hover); }
button.primary:active { background:var(--blue-pressed); }
button.secondary {
  background:rgba(0,0,0,0.04); color:var(--text-primary);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,0.06);
}
button.secondary:hover { background:rgba(0,0,0,0.08); }
button.secondary:active { background:rgba(0,0,0,0.12); }
button.danger { background:var(--red); color:#fff; }
button.danger:hover { background:var(--red-hover); }
button.danger:active { background:#B3201A; }

.empty-state {
  font-size:12px; color:var(--text-tertiary); font-weight:400;
  display:flex; align-items:center; gap:6px;
}
.empty-state::before {
  content:''; display:block; width:5px; height:5px;
  border-radius:50%; background:var(--text-tertiary); opacity:0.5;
}

/* Tool toast — bottom-right */
#tool-toast {
  position:fixed; bottom:20px; right:20px; z-index:50;
  background:var(--glass-bg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow), var(--glass-inset);
  color:var(--red);
  font-size:12px; font-weight:500; font-family:var(--font);
  padding:8px 16px; border-radius:var(--radius-sm);
  pointer-events:none;
  opacity:0; transform:translateX(12px);
  transition:opacity 200ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
}
#tool-toast.visible {
  opacity:1; transform:translateX(0);
}

.leaflet-control-zoom a {
  color:var(--text-primary) !important;
  background:var(--glass-bg) !important;
  backdrop-filter:var(--glass-blur) !important;
  -webkit-backdrop-filter:var(--glass-blur) !important;
  border:1px solid var(--glass-border) !important;
  box-shadow:var(--shadow-sm) !important;
  border-radius:var(--radius-sm) !important;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration:0ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  #toolbar, #editor-panel, #tool-toast, .constrain-popup, .leaflet-control-zoom a {
    background:var(--surface); backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  body::before { display:none; }
}

/* ============ Part C — Navigation panel (C1) ============ */
#nav-panel {
  position:fixed; left:60px; bottom:20px; z-index:40;
  width:328px; max-width:calc(100vw - 80px);
  background:rgba(255,255,255,0.46);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border-radius:var(--radius-lg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow), var(--glass-inset);
  padding:14px 16px 16px;
  opacity:0; transform:translateY(12px) scale(0.98);
  transition:opacity 240ms ease, transform 320ms cubic-bezier(0.22,1,0.36,1);
  pointer-events:none;
}
#nav-panel.visible { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

.nav-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.nav-head .nav-route-ico {
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--blue); color:#fff; font-size:13px;
}
.nav-head .nav-title { font-size:14px; font-weight:590; color:var(--text-primary); letter-spacing:-0.01em; }
.nav-head .nav-status { margin-left:auto; font-size:11px; font-weight:500; color:var(--text-tertiary); }

.nav-progress { height:4px; border-radius:2px; background:rgba(0,0,0,0.08); overflow:hidden; margin-bottom:14px; }
.nav-progress > i { display:block; height:100%; width:0%; border-radius:2px; background:var(--blue); transition:width 400ms cubic-bezier(0.22,1,0.36,1); }

.nav-stats { display:flex; gap:10px; margin-bottom:12px; }
.nav-stat {
  flex:1; background:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.5);
  border-radius:12px; padding:9px 11px;
}
.nav-stat .k { font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-tertiary); }
.nav-stat .v { font-size:19px; font-weight:600; color:var(--text-primary); letter-spacing:-0.02em; line-height:1.2; margin-top:2px; }
.nav-stat .v small { font-size:11px; font-weight:500; color:var(--text-secondary); margin-left:2px; }

.nav-next {
  display:flex; align-items:center; gap:10px;
  background:rgba(0,122,255,0.10); border:1px solid rgba(0,122,255,0.16);
  border-radius:12px; padding:9px 11px; margin-bottom:12px;
}
.nav-next .turn-ico {
  width:30px; height:30px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--blue); color:#fff; font-size:14px;
}
.nav-next .turn-txt { font-size:13px; font-weight:590; color:var(--text-primary); letter-spacing:-0.01em; }
.nav-next .turn-dist { margin-left:auto; font-size:12px; font-weight:500; color:var(--text-secondary); }

.nav-foot { display:flex; align-items:center; gap:8px; }
.nav-seg {
  display:inline-flex; background:rgba(0,0,0,0.05); border-radius:9px; padding:2px; gap:2px; flex:1;
}
.nav-seg button {
  flex:1; border:none; background:none; padding:5px 0; font-size:12px; font-weight:550;
  color:var(--text-secondary); border-radius:7px; cursor:pointer; transition:all 140ms ease;
}
.nav-seg button.active { background:#fff; color:var(--blue); box-shadow:var(--shadow-sm); }
.nav-cancel {
  flex-shrink:0; background:rgba(255,59,48,0.10); color:var(--red);
  border:none; border-radius:9px; padding:6px 12px; font-size:12px; font-weight:590; cursor:pointer;
  transition:background 120ms ease;
}
.nav-cancel:hover { background:rgba(255,59,48,0.18); }
.nav-cancel:active { transform:scale(0.97); }
.nav-dest { font-size:11px; color:var(--text-tertiary); margin-bottom:12px; word-break:break-all; }
.nav-dest b { color:var(--text-secondary); font-weight:600; }

/* Nav destination picker */
#nav-picker {
  position:fixed; left:50%; top:50%; transform:translate(-50%,-46%) scale(0.97);
  z-index:60; width:300px;
  background:rgba(255,255,255,0.92); backdrop-filter:blur(32px) saturate(180%); -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-radius:var(--radius-lg); border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow), var(--glass-inset); padding:18px 18px 16px;
  opacity:0; pointer-events:none; transition:opacity 200ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
}
#nav-picker.visible { opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }
#nav-picker h3 { font-size:15px; font-weight:590; margin-bottom:14px; letter-spacing:-0.01em; }
#nav-picker .pick-row { display:flex; gap:8px; margin-bottom:10px; }
#nav-picker .pick-row button {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 6px;
  background:rgba(0,0,0,0.04); border:none; border-radius:12px; cursor:pointer; color:var(--text-primary);
  font-size:12px; font-weight:550; transition:background 120ms ease, transform 80ms ease;
}
#nav-picker .pick-row button:hover { background:rgba(0,0,0,0.07); }
#nav-picker .pick-row button:active { transform:scale(0.97); }
#nav-picker .pick-row button i { font-size:18px; color:var(--blue); }
#nav-picker .pick-coords { display:flex; gap:7px; }
#nav-picker .pick-coords input { flex:1; width:auto; }
#nav-picker .pick-coords button { background:var(--blue); color:#fff; }

/* ============ Part C — Performance indicator (C2) ============ */
#perf-chip {
  position:fixed; left:60px; top:16px; z-index:30;
  display:flex; align-items:center; gap:7px;
  background:var(--glass-bg); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); border-radius:20px; padding:5px 12px;
  font-size:11px; font-weight:500; color:var(--text-secondary);
  box-shadow:var(--glass-shadow);
}
#perf-chip i { font-size:11px; color:var(--blue); }

/* ============ Part C — Batch bar (C3) ============ */
#batch-bar {
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(14px); z-index:45;
  display:flex; align-items:center; gap:8px;
  background:rgba(28,28,30,0.72); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:16px; padding:8px 12px; box-shadow:0 12px 40px rgba(0,0,0,0.22);
  opacity:0; pointer-events:none; transition:opacity 220ms ease, transform 280ms cubic-bezier(0.22,1,0.36,1);
}
#batch-bar.visible { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
#batch-bar .batch-title { color:rgba(255,255,255,0.6); font-size:11px; font-weight:600; padding:0 4px; }
#batch-bar button {
  background:rgba(255,255,255,0.12); color:#fff; border:none; border-radius:10px; padding:7px 13px;
  font-size:12px; font-weight:550; cursor:pointer; transition:background 120ms ease, transform 80ms ease;
}
#batch-bar button:hover { background:rgba(255,255,255,0.2); }
#batch-bar button:active { transform:scale(0.97); }
#batch-bar button.danger { background:rgba(255,59,48,0.85); }
#batch-bar button.danger:hover { background:var(--red); }

</style>
</head>
<body>
<div id="map"></div>

<div id="toolbar" class="toolbar-compact">
  <button class="tool-btn" id="tool-move" data-i18n-title="toolbar.move.title">
    <i class="fa-solid fa-arrows-up-down-left-right"></i>
    <span class="tool-label" data-i18n="toolbar.move.label"></span>
  </button>
  <div class="constrain-popup" id="constrain-popup">
    <button class="constrain-btn active" id="constrain-btn" data-i18n-title="toolbar.constrain.extend">
      <i class="fa-solid fa-angle-up"></i>
    </button>
  </div>
  <button class="tool-btn" id="tool-point" data-i18n-title="toolbar.point.title">
    <i class="fa-solid fa-circle-plus"></i>
    <span class="tool-label" data-i18n="toolbar.point.label"></span>
  </button>
  <button class="tool-btn" id="tool-merge" data-i18n-title="toolbar.merge.title">
    <i class="fa-solid fa-object-group"></i>
    <span class="tool-label" data-i18n="toolbar.merge.label"></span>
  </button>
  <button class="tool-btn" id="tool-fenhe" data-i18n-title="toolbar.fenhe.title">
    <i class="fa-solid fa-code-branch"></i>
    <span class="tool-label" data-i18n="toolbar.fenhe.label"></span>
  </button>
  <button class="tool-btn" id="tool-softdelete" data-i18n-title="toolbar.softdelete.title">
    <i class="fa-solid fa-eraser"></i>
    <span class="tool-label" data-i18n="toolbar.softdelete.label"></span>
  </button>
  <button class="tool-btn" id="tool-navigation" title="导航到地图位置">
    <i class="fa-solid fa-route"></i><span class="tool-label">导航</span>
  </button>
  <button class="tool-btn" id="tool-navigation-stop" title="取消导航">
    <i class="fa-solid fa-xmark"></i><span class="tool-label">取消导航</span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="tool-btn" id="tool-undo" data-i18n-title="toolbar.undo.title">
    <i class="fa-solid fa-arrow-rotate-left"></i>
    <span class="tool-label" data-i18n="toolbar.undo.label"></span>
  </button>
  <button class="tool-btn" id="tool-redo" data-i18n-title="toolbar.redo.title">
    <i class="fa-solid fa-arrow-rotate-right"></i>
    <span class="tool-label" data-i18n="toolbar.redo.label"></span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="tool-btn" id="tool-mode-toggle" data-i18n-title="toolbar.expand.title">
    <i class="fa-solid fa-chevron-right" id="mode-toggle-icon"></i>
    <span class="tool-label" data-i18n="toolbar.expand.label"></span>
  </button>
  <div class="toolbar-divider"></div>
  <button class="tool-btn" id="tool-language" title="Change Language" data-i18n-title="toolbar.language.title">
    <i class="fa-solid fa-language"></i>
    <span class="tool-label" data-i18n="toolbar.language.label"></span>
  </button>
</div>

<div id="tool-toast"></div>

<div id="editor-panel">
  <div id="no-selection" class="empty-state" data-i18n="editor.noSelection"></div>

  <div id="node-editor" style="display:none">
    <div class="section-label" data-i18n="editor.node.sectionLabel"></div>
    <div class="field"><span class="field-label" data-i18n="editor.node.id"></span><span class="field-value mono" id="node-id"></span></div>
    <div class="field"><span class="field-label" data-i18n="editor.node.x"></span><input type="number" id="node-x" step="0.1"></div>
    <div class="field"><span class="field-label" data-i18n="editor.node.z"></span><input type="number" id="node-z" step="0.1"></div>
    <div class="field"><span class="field-label" data-i18n="editor.node.source"></span><span class="field-value" id="node-source"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveNode()" data-i18n="editor.node.save"></button>
      <button class="secondary" onclick="clearSelection()" data-i18n="editor.node.cancel"></button>

      <button class="danger" onclick="deleteNode()" data-i18n="editor.node.delete"></button>
    </div>
  </div>

  <div id="segment-editor" style="display:none">
    <div class="section-label" data-i18n="editor.segment.sectionLabel"></div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.id"></span><span class="field-value mono" id="seg-id"></span></div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.classification"></span>
      <select id="seg-classification">
        <option value="" data-i18n="editor.segment.classification.none">—</option>
        <option value="G国道" data-i18n="editor.segment.classification.G国道">国道</option>
        <option value="G高速" data-i18n="editor.segment.classification.G高速">高速</option>
        <option value="S省道" data-i18n="editor.segment.classification.S省道">省道</option>
        <option value="S高架" data-i18n="editor.segment.classification.S高架">高架</option>
        <option value="X乡道" data-i18n="editor.segment.classification.X乡道">乡道</option>
        <option value="Y县道" data-i18n="editor.segment.classification.Y县道">县道</option>
        <option value="C村道" data-i18n="editor.segment.classification.C村道">村道</option>
      </select>
    </div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.number"></span><input type="text" id="seg-number" data-i18n-placeholder="editor.segment.number.placeholder"></div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.roadName"></span><input type="text" id="seg-road-name" data-i18n-placeholder="editor.segment.roadName.placeholder"></div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.source"></span><span class="field-value" id="seg-source"></span></div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.direction"></span>
      <select id="seg-direction">
        <option value="BIDIRECTIONAL" data-i18n="editor.segment.direction.bidirectional"></option>
        <option value="FORWARD" data-i18n="editor.segment.direction.forward"></option>
        <option value="BACKWARD" data-i18n="editor.segment.direction.backward"></option>
      </select>
    </div>
    <div class="field"><span class="field-label" data-i18n="editor.segment.status"></span><span class="field-value" id="seg-status"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveRoad()" data-i18n="editor.segment.save"></button>
      <button class="secondary" onclick="clearSelection()" data-i18n="editor.segment.cancel"></button>
      <button class="primary" id="merge-btn" style="display:none" onclick="mergeSegments()" data-i18n="editor.segment.mergeSelected"></button>
      <button class="danger" onclick="deleteSegment()" data-i18n="editor.segment.delete"></button>
    </div>
  </div>
</div>

<!-- Part C1 — Navigation panel -->
<div id="nav-panel">
  <div class="nav-head">
    <div class="nav-route-ico"><i class="fa-solid fa-route"></i></div>
    <span class="nav-title" data-i18n="nav.title"></span>
    <span class="nav-status" id="nav-status"></span>
  </div>
  <div class="nav-progress"><i id="nav-progress-bar"></i></div>
  <div class="nav-stats">
    <div class="nav-stat">
      <div class="k" data-i18n="nav.remaining"></div>
      <div class="v" id="nav-remaining">—</div>
    </div>
    <div class="nav-stat">
      <div class="k" data-i18n="nav.eta"></div>
      <div class="v" id="nav-eta">—</div>
    </div>
  </div>
  <div class="nav-next">
    <div class="turn-ico" id="nav-turn-ico"><i class="fa-solid fa-arrow-up"></i></div>
    <div class="turn-txt" id="nav-turn-txt">—</div>
    <div class="turn-dist" id="nav-turn-dist"></div>
  </div>
  <div class="nav-dest"><b data-i18n="nav.destination"></b> <span id="nav-dest-coords">—</span></div>
  <div class="nav-foot">
    <div class="nav-seg" id="nav-mode">
      <button data-mode="WALK" data-i18n="nav.walk"></button>
      <button data-mode="DRIVE" data-i18n="nav.drive"></button>
    </div>
    <button class="nav-cancel" id="nav-cancel" data-i18n="nav.cancel"></button>
  </div>
</div>

<!-- Part C1 — Destination picker -->
<div id="nav-picker">
  <h3 data-i18n="nav.pickTitle"></h3>
  <div class="pick-row">
    <button id="pick-on-map"><i class="fa-solid fa-location-crosshairs"></i><span data-i18n="nav.pickOnMap"></span></button>
  </div>
  <div class="pick-coords">
    <input type="text" id="pick-coords-input" data-i18n-placeholder="nav.coordsPlaceholder">
    <button id="pick-coords-go"><i class="fa-solid fa-arrow-right"></i></button>
  </div>
</div>

<!-- Part C2 — Performance indicator -->
<div id="perf-chip"><i class="fa-solid fa-layer-group"></i><span id="perf-text"></span></div>

<!-- Part C3 — Batch action bar -->
<div id="batch-bar">
  <span class="batch-title" data-i18n="edit.batchTitle"></span>
  <button id="batch-delete" class="danger"><i class="fa-solid fa-trash"></i> <span id="batch-del-label"></span></button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
