<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayfarer 道路编辑器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#1a1a2e; color:#e0e0e0; }
#map { height:70vh; width:100%; background:#0d1117; }
#sidebar { height:30vh; padding:12px 16px; overflow-y:auto; border-top:2px solid #303050; }
.section-title { font-size:14px; font-weight:600; color:#8888cc; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
.field { margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.field label { font-size:13px; color:#aaa; min-width:48px; }
.field input, .field select { background:#2a2a3e; border:1px solid #444; color:#e0e0e0; padding:4px 8px; border-radius:4px; font-size:13px; width:160px; }
.field input[type="color"] { width:48px; height:28px; padding:2px; }
.btn-row { display:flex; gap:8px; margin-top:10px; }
button { background:#3a3a5e; color:#e0e0e0; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px; }
button:hover { background:#4a4a7e; }
button.danger { background:#5e2a2a; }
button.danger:hover { background:#7e3a3a; }
button.primary { background:#2a4a7e; }
button.primary:hover { background:#3a5a9e; }
#status { font-size:12px; color:#888; margin-top:6px; }
#merge-btn { display:none; }
.popup-content { color:#222; font-size:12px; max-width:200px; }
.popup-content strong { display:block; margin-bottom:2px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="sidebar">
  <div id="no-selection" class="section-title">点击节点或路段查看属性</div>
  <div id="node-editor" style="display:none">
    <div class="section-title">节点属性</div>
    <div class="field"><label>ID</label><span id="node-id" style="font-size:11px;color:#888"></span></div>
    <div class="field"><label>X</label><input type="number" id="node-x" step="0.1"></div>
    <div class="field"><label>Z</label><input type="number" id="node-z" step="0.1"></div>
    <div class="field"><label>来源</label><span id="node-source" style="font-size:12px"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveNode()">保存</button>
      <button class="danger" onclick="deleteNode()">删除</button>
      <button class="danger" id="node-split-btn" style="display:none" onclick="splitSegment()">在此拆分</button>
    </div>
  </div>
  <div id="segment-editor" style="display:none">
    <div class="section-title">路段属性</div>
    <div class="field"><label>ID</label><span id="seg-id" style="font-size:11px;color:#888"></span></div>
    <div class="field"><label>道路名</label><input type="text" id="seg-road-name" placeholder="关联道路名"></div>
    <div class="field"><label>颜色</label><input type="color" id="seg-color"></div>
    <div class="field"><label>来源</label><span id="seg-source" style="font-size:12px"></span></div>
    <div class="field"><label>状态</label><span id="seg-status" style="font-size:12px"></span></div>
    <div class="btn-row">
      <button class="primary" onclick="saveRoad()">保存道路</button>
      <button class="danger" onclick="deleteSegment()">删除路段</button>
      <button class="primary" id="merge-btn" onclick="mergeSegments()">合并选中路段</button>
    </div>
  </div>
  <div id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
