# --- Config tooltips (malilib looks up "config.comment.<lowercased name>") ---
config:
  comment:
    navsnapradius: Snap radius used to attach navigation start/end to nearby road nodes
    navreroutethreshold: Distance off-route that triggers automatic re-routing
    navarrivalradius: Radius that counts as having reached the destination
    navdistancegate: Straight-line distance threshold above which road class preference applies
    navspeedg: Navigation speed on national roads (blocks/second)
    navspeeds: Navigation speed on provincial roads (blocks/second)
    navspeedy: Navigation speed on county roads (blocks/second)
    navspeedx: Navigation speed on township roads (blocks/second)
    navspeedc: Navigation speed on village roads (blocks/second)
    defaultclassification: Classification applied by default when creating a new road
    autointegral: Whether recorded node coordinates are automatically rounded to whole blocks on all three axes
    autosnapendpoints: Snap the start/end of a recording to an existing node within rdpEpsilon, otherwise insert a new node at the closest point on a segment
    rdpepsilon: Douglas-Peucker simplification tolerance in blocks; higher values simplify more aggressively
    autodeleteorphannodes: Automatically delete nodes that are no longer referenced by any segment after every edit
    webmaxzoom: Maximum zoom level of the web map (10-20, default 10); higher values zoom in further
    autographify: Turns the road network into a graph in the informatics sense (every node with degree > 2 becomes an endpoint) so Dijkstra / A* can run on endpoints directly
    toolitem: "Survey tool item, e.g. minecraft:wheat_seeds, minecraft:wheat_seeds@0 or minecraft:wheat_seeds@0{NBT}"
    toolitemenabled: Whether held-item detection for Survey mode is enabled; when off, holding the tool does nothing
    nodeindicatorbeamheight: Height of the node indicator beam in blocks
    nodeindicatorbeamalpha: Alpha of the node indicator beam (0-1)
    showkeyhints: Show the key hint in the action bar when switching to the Survey tool item
    gcolor: Draw color of national roads on the map
    gwidth: Draw width of national roads on the map
    scolor: Draw color of provincial roads on the map
    swidth: Draw width of provincial roads on the map
    xcolor: Draw color of township roads on the map
    xwidth: Draw width of township roads on the map
    ycolor: Draw color of county roads on the map
    ywidth: Draw width of county roads on the map
    ccolor: Draw color of village roads on the map
    cwidth: Draw width of village roads on the map
    xaeroshowg: Show national roads on the Xaero world map
    xaeroshows: Show provincial roads on the Xaero world map
    xaeroshowx: Show township roads on the Xaero world map
    xaeroshowy: Show county roads on the Xaero world map
    xaeroshowc: Show village roads on the Xaero world map
    xaeroshowunclassified: Show unclassified roads on the Xaero world map
    togglerecording: Start or stop automatic road recording
    openmenu: Open the Wayfarer navigation menu
    sethelditemastool: Set the currently held item as the Survey tool
    navigation: Stop the navigation that is currently running
