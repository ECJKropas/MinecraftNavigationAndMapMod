# --- Config tooltips (malilib looks up "config.comment.<lowercased name>") ---
config:
  comment:
    navsnapradius: 导航起点和终点的道路节点吸附半径
    navreroutethreshold: 偏离路线后自动重新规划的距离
    navarrivalradius: 进入终点后的到达判定半径
    navdistancegate: 启用道路等级偏好的直线距离阈值
    navspeedg: 国道导航速度（格/秒）
    navspeeds: 省道导航速度（格/秒）
    navspeedy: 县道导航速度（格/秒）
    navspeedx: 乡道导航速度（格/秒）
    navspeedc: 村道导航速度（格/秒）
    defaultclassification: 新建道路时默认使用的分级代码
    autointegral: 录制道路时是否自动将节点坐标取整（三轴均舍入到整数），默认开启
    autosnapendpoints: 录制结束时自动吸附首尾端点：先找 rdpEpsilon 范围内的现有节点，再找路段折线的垂足插入，均无可创建新节点
    rdpepsilon: RDP 简化容差（格数），值越大简化越激进
    autodeleteorphannodes: 开启后每次增删改节点后自动删除没有路段连接的孤立节点
    webmaxzoom: 网页端地图最大放大等级（10-20，默认10），数值越高可放大越近
    autographify: 自动将道路网转化为信息学意义上的图（所有度数>2的节点均为端点），消除被穿越的非端节点，确保 Dijkstra / A* 等算法可直接基于端点运行。默认开启
    toolitem: "Survey 模式工具物品，格式: minecraft:wheat_seeds 或 minecraft:wheat_seeds@0 或 minecraft:wheat_seeds@0{NBT}"
    toolitemenabled: 是否启用 Survey 工具物品检测。关闭后手持工具也不会触发 Survey 模式
    nodeindicatorbeamheight: 节点指示物光柱高度（格数）
    nodeindicatorbeamalpha: 节点指示物光柱透明度（0-1）
    showkeyhints: 切换到 Survey 工具物品时显示按键提示（action bar）
    gcolor: 国道在地图上的绘制颜色
    gwidth: 国道在地图上的绘制线宽
    scolor: 省道在地图上的绘制颜色
    swidth: 省道在地图上的绘制线宽
    xcolor: 乡道在地图上的绘制颜色
    xwidth: 乡道在地图上的绘制线宽
    ycolor: 县道在地图上的绘制颜色
    ywidth: 县道在地图上的绘制线宽
    ccolor: 村道在地图上的绘制颜色
    cwidth: 村道在地图上的绘制线宽
    xaeroshowg: 在 Xaero 世界地图上显示国道
    xaeroshows: 在 Xaero 世界地图上显示省道
    xaeroshowx: 在 Xaero 世界地图上显示乡道
    xaeroshowy: 在 Xaero 世界地图上显示县道
    xaeroshowc: 在 Xaero 世界地图上显示村道
    xaeroshowunclassified: 在 Xaero 世界地图上显示未分类道路
    togglerecording: 按下时开始或停止自动记录道路
    openmenu: 打开 Wayfarer 导航菜单
    sethelditemastool: 将当前手持物品设为 Survey 工具
    navigation: 停止当前正在进行的导航
